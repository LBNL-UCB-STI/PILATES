name: pilates
channels:
  - conda-forge
  - defaults
dependencies:
  # ============================================================================
  # Core Python and minimal conda packages
  # ============================================================================
  - python=3.11.6
  - pip

  # Only critical scientific packages via conda (for binary compatibility)
  - numpy=1.23.*
  - pandas=1.5.*
  - geos=3.12.*  # Pin to 3.12 to match Shapely/GEOS compilation

  # ============================================================================
  # All other packages via pip (faster than conda for many packages)
  # ============================================================================
  - pip:
    # Core utilities
    - pydantic>=2.0

    # Scientific/data packages
    - numexpr==2.10.2
    - bottleneck==1.4.2
    - blosc2~=2.0.0
    - tables==3.8.0
    - h5py
    - matplotlib==3.7.1
    - numba==0.57.0

    # Geospatial packages
    - shapely==1.8.5
    - pyproj==3.6.1
    - geopandas==0.11.1

    # Data format packages
    - pyarrow==10.0.1
    - openmatrix
    - xarray==2023.12.0
    - zarr>=3.0.6

    # Utility packages
    - requests
    - urllib3<2.0.0
    - pyyaml
    - psutil
    - joblib
    - docker

    # Database packages
    - duckdb
    - sqlmodel
    - pyhocon==0.3.61

    # Provenance tracking
    - consist[ingest,ibis,git] @ git+https://github.com/LBNL-UCB-STI/consist.git@38ab99247dbba4161bcb165b3745c579cad49aeb
    - ruff>=0.15.5

    # Local packages (install consist library in editable mode)
    # Note: Run separately after env creation: pip install -e ../consist
    # - -e ../consist
