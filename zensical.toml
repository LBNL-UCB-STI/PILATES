[project]
site_name = "PILATES"
repo_url = "https://github.com/LBNL-UCB-STI/PILATES"
site_description = "Integrated land use, travel demand, traffic, and vehicle fleet simulation workflows"
site_author = "Zach Needell"
site_url = "https://LBNL-UCB-STI.github.io/PILATES/"
copyright = """
Copyright &copy; 2026 The Regents of the University of California, through Lawrence Berkeley National Laboratory
"""
nav = [
    { "Home" = "index.md" },
    { "Start Here" = ["start-here/getting_started.md", "start-here/configuration_basics.md"] },
    { "Run PILATES" = ["run/scenario_lifecycle.md", "run/cli.md", "run/configuration_reference.md", "run/hpc_overview.md", "run/lawrencium.md", "run/run_promotion.md", "run/troubleshooting.md"] },
    { "Workflow & Semantics" = ["workflow/architecture.md", "workflow/step_contracts.md", "workflow/artifact_flow.md", "workflow/lineage_map.md"] },
    { "Extend PILATES" = ["extend/adding_a_model.md", "extend/output_validation.md"] },
    { "Analyze Runs" = ["analysis/overview.md", "analysis/scenario_comparison.md", "analysis/sql_and_duckdb.md"] },
    { "Reference" = ["reference/model_boundaries.md", "reference/workspace_layout.md", "reference/zone_and_skim_alignment.md", "reference/database_and_schemas.md", "reference/glossary.md"] },
]
extra_css = ["stylesheets/extra.css"]

[project.theme.icon]
logo = "lucide/building-2"
favicon = "lucide/building-2"

[project.theme]
#favicon = "lucide/building-2"
#icon = "lucide/building-2"
language = "en"
features = [
    "announce.dismiss",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Libre Franklin"
code = "JetBrains Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/LBNL-UCB-STI/PILATES"
