name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-suite:
    name: Pytest suite
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            environment.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Ruff formatting
        run: |
          python -m ruff format --check .

      - name: Run Ruff lint
        run: |
          python -m ruff check .

      - name: Collect tests
        run: |
          python -m pytest --collect-only -q tests

      - name: Run unit and integration pytest suite
        run: |
          python -m pytest -q tests -m "not slow_ci and not contract_harness"

      - name: Run contract-validating workflow harness
        run: |
          python -m pytest -v tests/test_contract_validating_workflow_harness.py
