# PILATES Configuration File (Inherited Format)
# SFBay Consist UrbanSim HPC - Full Horizon (2017-2050)

base: settings-sfbay-consist-usim-hpc-2019.yaml

run:
  end_year: 2050
  output_run_name: consist-sfbay-usim-base
  travel_model_freq: 6
  vehicle_ownership_freq: 6

shared:
  database:
    path: /global/home/users/$USER/scratch/sources/PILATES/pilates/database/provenance_sfbay_clean.duckdb

infrastructure:
  docker_images:
    beam: zaneedell/beam:0.9.10
  singularity_images:
    beam: docker://zaneedell/beam:1.1-beta-v260421

activitysim:
  num_processes: 22
