# PILATES Configuration File (Inherited Format)
# SFBay Newconfig with UrbanSim + ATLAS on HPC

base: settings-sfbay-newconfig-hpc.yaml

run:
  end_year: 2050
  models:
    land_use: urbansim
    vehicle_ownership: atlas
  output_run_name: new-asim-snapshots-usim
  supply_demand_iters: 1
  travel_model_freq: 6
  vehicle_ownership_freq: 6

activitysim:
  household_sample_size: 0
  num_processes: 45

atlas:
  adscen: baseline
  basedir: /
  beamac: 0
  codedir: /
  command_template: --freq {0} --outyear {1} --npe {2} --nsample {3} --basedir {4} --codedir {5} --beamac {6} --mod {7} --adscen
    {8} --rebfactor {9} --taxfactor {10} --discIncent {11}
  container_input_folder: /atlas_input
  container_output_folder: /atlas_output
  discIncent: 0
  host_input_folder: pilates/atlas/atlas_input
  host_mutable_input_folder: atlas/atlas_input
  host_output_folder: atlas/atlas_output
  mod: 2
  num_processes: 8
  rebfactor: 1
  sample_size: 0
  scenario: baseline
  taxfactor: 1
  warmstart_input_folder: pilates/atlas/atlas_input
