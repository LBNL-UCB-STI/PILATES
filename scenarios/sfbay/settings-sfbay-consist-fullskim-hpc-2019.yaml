# =============================================================================
# INFRASTRUCTURE CONFIGURATION
# Container management (Docker/Singularity) and execution environment
# =============================================================================
infrastructure:
  container_manager: singularity
  singularity_images:
    urbansim: docker://jdcaicedo/urbansim_demos:v0.1.1
    atlas: docker://ghcr.io/lbnl-science-it/atlas:sfb-v2.0.12
    activitysim: docker://zaneedell/activitysim:0.2.18
    beam: docker://zaneedell/beam:1.1-beta-v261009
  docker_images:
    urbansim: jdcaicedo/urbansim_demos:v0.1.1
    atlas: ghcr.io/lbnl-science-it/atlas:v1.0.7
    beam: zaneedell/beam:1.1-beta-v261009
    activitysim: zaneedell/activitysim:0.2.18
    polaris: tbd
  docker_config:
    stdout: false
    pull_latest: false

# =============================================================================
# BEAM CONFIGURATION
# Transportation network simulation and standalone full-skim settings
# =============================================================================
beam:
  config: scenarios/sfbay-pilates-base-calibrated.conf
  sample: 0.1
  replanning_portion: 0.4
  memory: 180g
  local_input_folder: pilates/beam/production/
  local_mutable_data_folder: beam/input/
  local_output_folder: beam/beam_output/
  scenario_folder: urbansim/
  router_directory: r5/sfbay-cbg5500-weakConn-network
  warmstart_linkstats_path: "{router_directory}/init.linkstats.parquet"
  admission:
    linkstats:
      mode: strict
      expectation:
        kind: declared_digest
        identity: "sha256:file:26e8153fa3e73cf3635c45cb00b185acf327dd75338ad77ca5e30ce060c6b2e5"
        source_label: "beam-fc07-v260419-it3 (it.3)"
        source_uri: "https://drive.google.com/file/d/10ubIO7oamqNbzvRlDfIWcQ8xSWcee9s5/view?usp=share_link"
  full_skim:
    run_schedule: standalone
    router_type: r5+gh
    skims_geo_type: taz
    skims_kind: activitySimOmx
    # Full 5 ActivitySim time periods (EA=5.0, AM=8.5, MD=12.0, PM=17.5, EV=22.1)
    peak_hours:
      - 5.0
      - 8.5
      - 12.0
      - 17.5
      - 22.1
    modes_to_build:
      drive: true
      walk: true
      transit: true
    bifurcate_tolls: true
    generate_return_trips: true
    toll_file_path: toll-prices.csv
  skims_shapefile: shape/block-groups-32048.shp
  skim_zone_source_id_col: sk_zone
  skim_zone_geoid_col: geoid10
  discard_plans_every_year: false
  max_plans_memory: 5
  simulated_hwy_paths:
  - SOV
  - HOV2
  - HOV3
  asim_hwy_measure_map:
    TIME: TIME_minutes
    DIST: DIST_miles
    BTOLL: null
    VTOLL: VTOLL_FAR
  asim_transit_measure_map:
    WAIT: null
    IVT: TOTIVT_IVT_minutes
    TOTIVT: TOTIVT_IVT_minutes
    KEYIVT: KEYIVT_minutes
    FERRYIVT: FERRYIVT_minutes
    FAR: VTOLL_FAR
    DTIM: DTIM_minutes
    DDIST: DDIST_miles
    WAUX: WAUX_minutes
    WEGR: WEGR_minutes
    WACC: WACC_minutes
    IWAIT: IWAIT_minutes
    XWAIT: XWAIT_minutes
    BOARDS: BOARDS
  asim_ridehail_measure_map:
    WAIT: waitTimeInMinutes
    REJECTIONPROB: unmatchedRequestPortion
  ridehail_path_map:
    RH_SOLO: Solo
    RH_POOLED: Pooled
