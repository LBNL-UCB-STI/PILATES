# PILATES Configuration File (Inherited Format)
# SFBay Consist UrbanSim + ATLAS + ActivitySim + BEAM on HPC (Short Horizon 2017-2025)

base: settings-sfbay-consist-base-hpc.yaml

run:
  end_year: 2025
  output_run_name: consist-sfbay-usim-base-short
